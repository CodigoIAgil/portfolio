<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#05070d" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#05070d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fundo)"/>
  <!-- monitor -->
  <rect x="900" y="170" width="560" height="360" rx="18" fill="#1b263b"/>
  <rect x="925" y="195" width="510" height="310" rx="8" fill="#0b132b"/>
  <rect x="1145" y="530" width="70" height="90" fill="#1b263b"/>
  <rect x="1060" y="615" width="240" height="22" rx="11" fill="#1b263b"/>
  <!-- linhas de código -->
  <g fill="#1e96fc">
    <rect x="955" y="230" width="140" height="14" rx="7"/>
    <rect x="985" y="320" width="220" height="14" rx="7"/>
    <rect x="955" y="410" width="120" height="14" rx="7"/>
  </g>
  <g fill="#3a506b">
    <rect x="1110" y="230" width="200" height="14" rx="7"/>
    <rect x="985" y="260" width="300" height="14" rx="7"/>
    <rect x="1015" y="290" width="180" height="14" rx="7"/>
    <rect x="1220" y="320" width="150" height="14" rx="7"/>
    <rect x="1015" y="350" width="260" height="14" rx="7"/>
